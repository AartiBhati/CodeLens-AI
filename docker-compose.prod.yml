services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - codelens

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - codelens

  zookeeper:
    image: zookeeper:3.9
    restart: unless-stopped
    networks:
      - codelens

  kafka:
    image: confluentinc/cp-kafka:7.7.12
    restart: unless-stopped
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - codelens

  qdrant:
    image: qdrant/qdrant:v1.12.5
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - codelens

  backend:
    image: ${DOCKERHUB_USERNAME}/codelens-backend:${IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
      - kafka
      - qdrant
    env_file:
      - .env
    expose:
      - "8000"
    networks:
      - codelens

  worker:
    image: ${DOCKERHUB_USERNAME}/codelens-worker:${IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
      - kafka
      - qdrant
    env_file:
      - .env
    networks:
      - codelens

  frontend:
    image: ${DOCKERHUB_USERNAME}/codelens-frontend:${IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - codelens

networks:
  codelens:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  qdrant_data:
